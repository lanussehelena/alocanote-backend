server:
  port: 8082

spring:
  application:
    name: api

  datasource:
    url: jdbc:h2:file:./data/alocanotedb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      fail-on-empty-beans: false

api:
  security:
    token:
      secret: ${JWT_SECRET:alocanote-secret-key-default-change-in-production-2026}
      expiration: 86400000

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}

