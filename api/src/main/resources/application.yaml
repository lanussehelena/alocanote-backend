server:
  port: 8082

spring:
  application:
    name: api

  datasource:
    url: jdbc:h2:mem:alocanotedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # O h2 deve estar exatamente com 2 espaços de recuo (alinhado com datasource e jpa)
  h2:
    console:
      enabled: true
      path: /h2-console